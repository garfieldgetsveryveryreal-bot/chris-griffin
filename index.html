<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Billboard Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            font-family: sans-serif;
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instructions">
        <h3>3D Billboard Game</h3>
        <p>Use <b>W / S</b> to move Forward / Backward.<br>Use <b>A / D</b> to Rotate.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Scene, Camera, and Renderer Setup (Anti-aliasing disabled for performance)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. Create the Ground Plane with Local Looping Texture ('grass.jpg')
        const planeSize = 200;
        const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize);

        const textureLoader = new THREE.TextureLoader();
        const grassTexture = textureLoader.load('grass.jpg', (texture) => {
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            
            // Cranked up to match a 1-to-1 ratio for a small texture to look crisp and detailed
            texture.repeat.set(planeSize, planeSize);

            texture.generateMipmaps = false;
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;
        });

        // MeshBasicMaterial keeps it completely flat and unlit (no black shadows)
        const planeMaterial = new THREE.MeshBasicMaterial({ map: grassTexture });
        const ground = new THREE.Mesh(planeGeometry, planeMaterial);
        ground.rotation.x = -Math.PI / 2; // Lay it flat
        scene.add(ground);

        // 3. Create the 2D Billboard Player Placeholder
        const playerPosition = new THREE.Vector3(0, 1, 0);
        let playerRotation = 0; // Angle in radians
        const playerSpeed = 0.12;
        const rotationSpeed = 0.04;

        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(0, 0, 128, 128);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PLAYER', 64, 70);

        const playerTexture = new THREE.CanvasTexture(canvas);
        playerTexture.generateMipmaps = false;
        playerTexture.minFilter = THREE.LinearFilter;

        const playerMaterial = new THREE.SpriteMaterial({ map: playerTexture });
        const player = new THREE.Sprite(playerMaterial);
        player.scale.set(2, 2, 1);
        player.position.copy(playerPosition);
        scene.add(player);

        // 4. Input Handling
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // 5. Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Handle Rotation (A and D)
            if (keys['a'] || keys['arrowleft']) playerRotation += rotationSpeed;
            if (keys['d'] || keys['arrowright']) playerRotation -= rotationSpeed;

            // Handle Forward/Backward Movement (W and S)
            let moveDirection = 0;
            if (keys['w'] || keys['arrowup']) moveDirection = 1;
            if (keys['s'] || keys['arrowdown']) moveDirection = -1;

            if (moveDirection !== 0) {
                player.position.x += Math.sin(playerRotation) * playerSpeed * moveDirection;
                player.position.z += Math.cos(playerRotation) * playerSpeed * moveDirection;
            }

            // Keep player within bounds
            const boundLimit = planeSize / 2 - 5;
            player.position.x = Math.max(-boundLimit, Math.min(boundLimit, player.position.x));
            player.position.z = Math.max(-boundLimit, Math.min(boundLimit, player.position.z));

            // Calculate ideal camera position right behind the player's back based on rotation
            const targetCamX = player.position.x - Math.sin(playerRotation) * 6;
            const targetCamY = player.position.y + 3;
            const targetCamZ = player.position.z - Math.cos(playerRotation) * 6;

            // Smooth camera following (Lerp for fluidity)
            camera.position.x += (targetCamX - camera.position.x) * 0.1;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.position.z += (targetCamZ - camera.position.z) * 0.1;

            // Look at the player
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
